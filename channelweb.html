<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- 1. Load Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Container styling */
    .icon-bar {
      display: flex;
      gap: 28px;
      
      padding: 20px;
    }

    /* Base Icon Styles */
    .icon-item {
      display: inline-flex;
      
      cursor: pointer;
      color: #1a1a1a; /* Default icon color */
      transition: transform 0.25s ease, color 0.25s ease; /* Smooth hover transition */
    }

    .icon-item i {
      width: 15px;
      height: 15px;
      stroke-width: 1.8;
    }

    /* Interactive Hover Effect */
    .icon-item:hover {
      color: #2563eb; /* Changes color to vibrant blue on hover */
      transform: translateY(-3px) scale(1.12); /* Slightly lifts and enlarges */
    }

    /* Optional: Click effect */
    .icon-item:active {
      transform: translateY(0) scale(0.98);
    }
    .d1{
        background-image: url(1786953256299-homepage-corpo-one-1.avif);
        width: 100%;
        height: 420PX;
    }
    .d2{
        background-image: url(watch.avif);
        background-size: 100% 100%;
        height: 100px;
       
        
    }
    /* Essential background properties */
      background-size: cover;       /* Resizes image to cover entire div */
      background-position: center;  /* Centers the image */
      background-repeat: no-repeat; /* Prevents tiling */
  </style>
  </head>
  <body>
    <div style="position: fixed;">
            <nav style="height: 50px;">

     <span style="margin-left: 20%;">

        <a class="icon-item" aria-label="Search">

        </a>  &nbsp;
    <a class="icon-item" aria-label="Account">

    </a> &nbsp;
    <a class="icon-item" aria-label="Wishlist">

    </a>  &nbsp;
    <a class="icon-item" aria-label="Shopping Bag">
      <i data-lucide="shopping-bag"></i>
    </a></span>

        </div>
     
      
  

    </nav>
    </div>
